name: VK to Telegram Bot

on:
  workflow_dispatch:        # возможность запускать вручную

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Restore last post ID
        uses: actions/cache@v4
        with:
          path: last_post_id.json
          key: last-post-id-${{ github.run_id }}
          restore-keys: |
            last-post-id-

      - name: Run bot
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHANNEL }}
          USE_PLAYWRIGHT: "1"
          CHECK_INTERVAL: "60"
        run: |
          # Запускаем один раз (не в бесконечном цикле)
          # Чтобы бот работал по расписанию GitHub Actions
          python main.py --once || python main.py

      - name: Save last post ID
        if: always()
        uses: actions/cache@v4
        with:
          path: last_post_id.json
          key: last-post-id-${{ github.run_id }}
