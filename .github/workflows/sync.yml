name: VK to Telegram Sync

#on:
#  push:
#    paths:
#      - 'state.json'
#  workflow_dispatch:

# Изменяем логику: если запустился новый воркфлоу, 
# старый НЕ отменяется, а ждет своей очереди в очереди (queue)
concurrency:
  group: vk-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PAT }}
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
        run: python main.py

      - name: Commit state
        run: |
          git config user.name "vk-bot"
          git config user.email "bot@github.com"
          
          # Явно вытягиваем изменения, если они были, чтобы избежать конфликтов push
          git pull origin main --rebase

          git add state.json
          git commit -m "update state" || echo "no changes"
          git push
